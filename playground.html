<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CREATIVE PLAYGROUND — CREATV MYNDZ</title>
  <meta name="description" content="Todos los CRTV de CREATV MYNDZ, uno por uno.">
  <meta name="theme-color" content="#0a1238">
  <link rel="icon" href="assets/img/favicon.png" sizes="any">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/outfit-latin.woff2" crossorigin>
  <link rel="preload" as="image" href="assets/floor/d/0001.webp" media="(min-aspect-ratio: 1/1)">
  <link rel="preload" as="image" href="assets/floor/m/0001.webp" media="(max-aspect-ratio: 1/1)">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <!-- ===== CAÍDA: al entrar, unas décimas bajando del cielo al pasto
       (viene de VER TODOS LOS CRTV en la portada). Se quita sola. ===== -->
  <div class="playground-fall" id="playground-fall" aria-hidden="true"></div>

  <!-- ===== PASTO: mismo motor que el cielo de la portada, pero con las
       fotos del prado (assets/floor) en vez del cielo ===== -->
  <canvas id="sky" data-frames="assets/floor" aria-hidden="true"></canvas>
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <!-- ===== BARRA SUPERIOR ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <a class="back-index" href="index.html">↑ CREATV MYNDZ</a>
      <span class="flying-row"><span class="plane" aria-hidden="true">✈</span><span id="flying">FLYING 0%</span></span>
      <span id="clocks" class="clocks fades">BOGOTÁ · MIAMI · MADRID</span>
    </div>

    <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu">
      <span data-i18n="menu">MENÚ</span>
    </button>

    <div class="topbar-right">
      <span class="crtv-mark fades">CRTV©</span>
      <button id="lang-es" class="lang active" type="button">ES</button>
      <button id="lang-en" class="lang" type="button">EN</button>
    </div>
  </header>

  <!-- ===== MENÚ ===== -->
  <nav class="menu" id="menu" hidden aria-label="Menú principal">
    <button class="menu-close" id="menu-close" type="button" aria-label="Cerrar menú">✕</button>
    <ul class="menu-list">
      <li><a href="index.html#crtv"><span class="menu-num">01</span><span data-i18n="m_projects">CRTV</span></a></li>
      <li><a href="index.html#nosotros"><span class="menu-num">02</span><span data-i18n="m_about">CREATIVE DEALERS</span></a></li>
      <li><a href="index.html#wakeup"><span class="menu-num">03</span><span data-i18n="m_wakeup">WAKE UP</span></a></li>
    </ul>
    <p class="menu-foot" data-i18n="footer_line">CREATIVE DEALERS</p>
  </nav>

  <!-- ===== LO PRIMERO QUE SE VE ===== -->
  <section class="playground-hero scene" id="top" data-enter="no">
   <div class="pin">
    <div class="project-inner depth">
      <span class="p-num">CRTV</span>
      <img class="playground-logo" src="assets/img/logo-creativ-playground.png" alt="CREATV Playground" width="1520" height="344">
    </div>
   </div>
  </section>

  <!-- ===== CRTV: la lista completa ===== -->
  <main>
    <ul id="project-list" class="project-list"></ul>
  </main>

  <script src="assets/projects.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // Se quita sola cuando termina de caer; si el sistema pide menos
    // movimiento, ni siquiera se muestra.
    var fallEl = document.getElementById("playground-fall");
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      fallEl.remove();
    } else {
      fallEl.addEventListener("animationend", function () { fallEl.remove(); });
    }
  </script>
</body>
</html>
