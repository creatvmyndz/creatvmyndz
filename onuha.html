<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MYND ONUHA</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/img/onuha/onuha-logo.png">
  <link rel="apple-touch-icon" href="assets/img/onuha/onuha-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <style>
    /* Puerta a MYND ONUHA: los proyectos de ONUHA. El tablero vive en Claude; aquí solo se entra. */
    :root{--bg:#000;--ink:#fff;--muted:#8c8c8c;--line:rgba(255,255,255,.26);color-scheme:dark}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif}
    main{min-height:100%;display:grid;place-items:center;padding:24px 16px}
    .in{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
    .logo{width:min(480px,86vw);height:auto}
    .lab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
    .go{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:14px 34px;color:var(--ink);text-decoration:none;font-weight:600;font-stretch:125%;letter-spacing:.08em;text-transform:uppercase;font-size:14px;transition:background .2s,color .2s}
    .go:hover,.go:focus-visible{background:var(--ink);color:var(--bg);outline:none}
    @media (prefers-reduced-motion:no-preference){.in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}}
  </style>
</head>
<body>
  <main>
    <div class="in">
      <img class="logo" src="assets/img/onuha/onuha-logo.png" alt="ONUHA">
      <span class="lab">MYND ONUHA</span>
      <a class="go" href="https://claude.ai/artifact/XReKfEBfiiUscjvgtw83pi" rel="noopener">Entrar</a>
    </div>
  </main>
</body>
</html>
