name: Deploy a producción (Netlify)

# Cada push a main publica el sitio en creatvmyndz.com automáticamente.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Revisar que las llaves de Netlify estén configuradas
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$SITE" ]; then
            echo "::error::Faltan los secretos NETLIFY_AUTH_TOKEN y/o NETLIFY_SITE_ID."
            echo "::error::Settings -> Secrets and variables -> Actions. Pasos en el README."
            exit 1
          fi

      - name: Preparar los archivos del sitio
        run: |
          mkdir -p dist
          cp index.html _headers dist/
          cp -r assets dist/

      - name: Publicar en Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --dir=dist --prod --message "${{ github.event.head_commit.message || 'Deploy manual' }}"
